
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-container">
        <header>
          
            <h1>Tic <span>Tac</span> Toe</h1>
            <p class="subtitle">A little strategy goes a long way.</p>
        </header>

        <div class="mode-selector">
            <button class="mode active" data-mode="pvp">
                2 Players
            </button>
            <button class="mode" data-mode="computer">
                Vs Computer
            </button>
        </div>

        <div class="scoreboard">
            <div class="score-card x-card">
                <span class="player-label">PLAYER X</span>
                <span class="symbol">X</span>
                <span class="score" id="scoreX">0</span>
            </div>

            <div class="score-card draw-card">
                <span class="player-label">DRAWS</span>
                <span class="symbol">–</span>
                <span class="score" id="scoreDraw">0</span>
            </div>

            <div class="score-card o-card">
                <span class="player-label" id="playerOLabel">PLAYER O</span>
                <span class="symbol">O</span>
                <span class="score" id="scoreO">0</span>
            </div>
        </div>

        <div class="status" id="status">
            Player X's turn
        </div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="button-group">
    <button id="restart" class="restart-btn">
        ↻ Next Round
    </button>

    <button id="resetScores" class="reset-btn">
        Reset Scores
    </button>
</div>

        
    </div>

</body>
</html>
